
<!DOCTYPE html>
<html lang="ru" class="dark" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoffeePeek</title>
    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <script>
      (function () {
        document.documentElement.classList.add('app-js');
        window.addEventListener('error', function (event) {
          if (event.target === window || event.target instanceof HTMLScriptElement && event.target.type === 'module') {
            document.documentElement.classList.remove('app-js');
          }
        }, true);
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') t = 'dark';
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.classList.toggle('dark', t === 'dark');
          document.documentElement.classList.toggle('light', t === 'light');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        #app-startup {
            display: none;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
        }
        .app-js #server-rendered-content { display: none; }
        .app-js #app-startup { display: flex; }
        body {
            font-family: 'Manrope', sans-serif;
            background-color: #1A1412;
            color: #FFFFFF;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        html[data-theme="light"] body {
            background-color: #FAFAF9;
            color: #1C1917;
        }
        html[data-theme="dark"] body {
            background-color: #1A1412;
            color: #FFFFFF;
        }
        /* Desktop background texture */
        .bg-pattern {
            background-image: radial-gradient(#2D241F 1px, transparent 1px);
            background-size: 40px 40px;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1A1412;
        }
        ::-webkit-scrollbar-thumb {
            background: #3D2F28;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4D3D33;
        }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
